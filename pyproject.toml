[project]
name = "crossborder-scraper"
version = "0.1.0"
description = "Scrape 1688/Taobao/AliExpress and export to Shopee, Lazada, TikTok Shop, Shopify"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "typer>=0.15.0",
    "loguru>=0.7.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "aiofiles>=24.1.0",
    "pillow>=11.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "pyyaml>=6.0.0",
    "rich>=13.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "croniter>=2.0.0",
    "psutil>=6.0.0",
]

[project.scripts]
scraper = "cli:app"
serve = "server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/api",
  "src/cli",
  "src/config",
  "src/core",
  "src/export",
  "src/pipeline",
  "src/server",
  "src/sites",
  "src/gateway",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
