# Built-in source scrape plugins (src/plugins/)
source_plugins:
  1688:
    enabled: true
  taobao:
    enabled: true
  aliexpress:
    enabled: true
  instagram:
    enabled: true
  tiktok:
    enabled: true
  linkedin:
    enabled: true
  custom_plugin:
    enabled: true
    extra_domains: []

# Security policy for user-installed plugins (installed_plugins/)
security:
  max_zip_bytes: 5242880          # 5 MB
  max_files_in_zip: 32
  max_plugin_py_bytes: 262144     # 256 KB per .py file
  scrape_timeout_seconds: 120
  allowed_archive_extensions: [".zip"]
  trusted_builtin_ids:
    - "1688"
    - taobao
    - aliexpress
    - instagram
    - tiktok
    - linkedin
    - custom_plugin
