# Source scrape plugins (built-in under src/plugins/)
source_plugins:
  instagram:
    enabled: true
  tiktok:
    enabled: true
  linkedin:
    enabled: true
  custom_plugin:
    enabled: true
    extra_domains: []

# Security policy for user-installed plugins (installed_plugins/)
security:
  max_zip_bytes: 5242880          # 5 MB
  max_files_in_zip: 32
  max_plugin_py_bytes: 262144     # 256 KB per .py file
  scrape_timeout_seconds: 120
  allowed_archive_extensions: [".zip"]
  # Built-in plugin IDs are trusted (src/plugins/) and skip AST sandbox
  trusted_builtin_ids:
    - instagram
    - tiktok
    - linkedin
    - custom_plugin
