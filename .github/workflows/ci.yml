name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Ruff
        run: uv run ruff check src main.py

      - name: Import smoke test
        run: bash -c 'source scripts/_lib.sh && smoke_imports'

      - name: Pytest (dev)
        run: bash scripts/test.sh dev

  web:
    name: Web client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: crossborder-scraper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Production smoke (container health)
        run: SMOKE_DOCKER_TAG=crossborder-scraper:ci SMOKE_SKIP_BUILD=1 bash scripts/smoke-docker.sh
        env:
          SMOKE_DOCKER_TAG: crossborder-scraper:ci
          SMOKE_SKIP_BUILD: "1"
