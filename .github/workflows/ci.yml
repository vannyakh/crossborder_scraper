name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Install ruff
        run: uv pip install ruff

      - name: Ruff
        run: uv run ruff check src main.py

      - name: Import smoke test
        run: uv run python -c "from cli.app import app; from server.app import app as api"

  web:
    name: Web client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: crossborder-scraper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container health
        run: |
          docker run -d --name crossborder-ci -p 18787:8787 \
            -e PANEL_AUTH_ENABLED=false \
            crossborder-scraper:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18787/health; then
              echo "Health OK"
              docker rm -f crossborder-ci
              exit 0
            fi
            sleep 2
          done
          docker logs crossborder-ci
          docker rm -f crossborder-ci
          exit 1
