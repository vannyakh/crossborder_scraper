name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify version tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG} → version ${VERSION}"

      - name: Match pyproject.toml version
        run: |
          PY_VER=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG_VER="${{ steps.meta.outputs.version }}"
          if [ "$PY_VER" != "$TAG_VER" ]; then
            echo "::error::Git tag v${TAG_VER} must match pyproject.toml version (${PY_VER})"
            exit 1
          fi
          echo "Version OK: ${PY_VER}"

  quality-python:
    name: Python lint
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync
      - run: uv pip install ruff
      - run: uv run ruff check src main.py
      - run: uv run python -c "from cli.app import app; from server.app import app as api"

  quality-web:
    name: Web client build
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  build-push:
    name: Build & push image
    needs: [verify, quality-python, quality-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ needs.verify.outputs.image }}:latest
            ${{ needs.verify.outputs.image }}:${{ needs.verify.outputs.version }}
            ${{ needs.verify.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-image:
    name: Smoke test image (amd64)
    needs: [verify, build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and health check
        run: |
          IMAGE="${{ needs.verify.outputs.image }}:${{ needs.verify.outputs.version }}"
          docker pull "${IMAGE}"
          docker run -d --name crossborder-release -p 18787:8787 \
            -e PANEL_AUTH_ENABLED=false \
            "${IMAGE}"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18787/health; then
              echo "Health OK"
              docker rm -f crossborder-release
              exit 0
            fi
            sleep 2
          done
          docker logs crossborder-release
          docker rm -f crossborder-release
          exit 1

  github-release:
    name: GitHub Release
    needs: [verify, build-push, smoke-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE: ${{ needs.verify.outputs.image }}
          REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<EOF
          ## Cross-Border v${VERSION}

          Self-host scrape panel with gateway agent and marketplace export.

          ### Docker (recommended for production)

          \`\`\`bash
          docker pull ${IMAGE}:${VERSION}
          docker run -d --name crossborder \\
            -p 8787:8787 \\
            -v crossborder-data:/app/data \\
            -v crossborder-config:/app/config \\
            --env-file .env \\
            --restart unless-stopped \\
            ${IMAGE}:${VERSION}
          \`\`\`

          Open: http://YOUR_HOST:8787/ui/login

          ### One-liner install

          **Linux / macOS**
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${REPO}/v${VERSION}/scripts/install.sh | bash
          \`\`\`

          **Windows**
          \`\`\`powershell
          powershell -NoProfile -ExecutionPolicy Bypass -Command "irm https://raw.githubusercontent.com/${REPO}/v${VERSION}/scripts/install.ps1 | iex"
          \`\`\`

          ### Upgrade existing install

          \`\`\`bash
          cd ~/crossborder-scraper
          uv run crossborder tools update
          \`\`\`
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.verify.outputs.version }}
          tag_name: ${{ needs.verify.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.tag, '-') }}
