name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify version tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG} → version ${VERSION}"

      - name: Match pyproject.toml version
        run: |
          PY_VER=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG_VER="${{ steps.meta.outputs.version }}"
          if [ "$PY_VER" != "$TAG_VER" ]; then
            echo "::error::Git tag v${TAG_VER} must match pyproject.toml version (${PY_VER})"
            exit 1
          fi
          echo "Version OK: ${PY_VER}"

  build-push:
    name: Build & push image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ needs.verify.outputs.image }}:latest
            ${{ needs.verify.outputs.image }}:${{ needs.verify.outputs.version }}
            ${{ needs.verify.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub Release
    needs: [verify, build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE: ${{ needs.verify.outputs.image }}
        run: |
          cat > release-notes.md <<EOF
          ## Crossborder Scraper v${VERSION}

          Self-host scrape panel with gateway agent and marketplace export.

          ### Docker (recommended for production)

          \`\`\`bash
          docker pull ${IMAGE}:${VERSION}
          docker run -d --name crossborder \\
            -p 8787:8787 \\
            -v crossborder-data:/app/data \\
            -v crossborder-config:/app/config \\
            --env-file .env \\
            ${IMAGE}:${VERSION}
          \`\`\`

          Open: http://YOUR_HOST:8787/ui/login

          ### One-liner install

          **Linux / macOS**
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/v${VERSION}/scripts/install.sh | bash
          \`\`\`

          **Windows**
          \`\`\`powershell
          powershell -NoProfile -ExecutionPolicy Bypass -Command "irm https://raw.githubusercontent.com/${{ github.repository }}/v${VERSION}/scripts/install.ps1 | iex"
          \`\`\`

          ### Upgrade existing install

          \`\`\`bash
          cd ~/crossborder-scraper
          uv run crossborder tools update
          \`\`\`
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.verify.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
