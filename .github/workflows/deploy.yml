name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (e.g. 0.1.0, latest, or full SHA)"
        required: true
        default: "latest"
      environment:
        description: "Deployment target label"
        type: choice
        options:
          - production
          - staging
        default: production
      run_ssh_deploy:
        description: "Run remote deploy over SSH (requires secrets)"
        type: boolean
        default: false

  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  packages: read

env:
  COMPOSE_PROJECT_NAME: crossborder

jobs:
  resolve:
    name: Resolve image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        run: |
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          TAG="${{ inputs.version }}"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            TAG="latest"
          fi
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="latest"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

  deploy-ssh:
    name: Deploy via SSH
    needs: resolve
    if: github.event_name == 'workflow_dispatch' && inputs.run_ssh_deploy == true
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Remote docker compose deploy
        if: ${{ secrets.DEPLOY_SSH_HOST != '' && secrets.DEPLOY_SSH_USER != '' && secrets.DEPLOY_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          TAG: ${{ needs.resolve.outputs.tag }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: IMAGE,TAG,DEPLOY_PATH
          script: |
            set -euo pipefail
            APP_DIR="${DEPLOY_PATH:-/opt/crossborder-scraper}"
            cd "$APP_DIR"
            export CROSSBORDER_IMAGE="${IMAGE}:${TAG}"
            echo "==> pull ${CROSSBORDER_IMAGE}"
            docker pull "${CROSSBORDER_IMAGE}"
            if [ -f docker-compose.release.yml ]; then
              docker compose -f docker-compose.release.yml pull
              docker compose -f docker-compose.release.yml up -d
            elif [ -f docker-compose.yml ] && [ -f docker-compose.prod.yml ]; then
              export CROSSBORDER_IMAGE
              docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            else
              docker stop crossborder-panel 2>/dev/null || true
              docker rm crossborder-panel 2>/dev/null || true
              docker run -d --name crossborder-panel \
                -p 8787:8787 \
                -v crossborder-data:/app/data \
                -v crossborder-config:/app/config \
                --env-file .env \
                --restart unless-stopped \
                "${CROSSBORDER_IMAGE}"
            fi
            sleep 5
            curl -sf "http://127.0.0.1:8787/health" && echo "Panel healthy"

  deploy-summary:
    name: Deploy instructions
    needs: resolve
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Deploy — ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}

          | | |
          |---|---|
          | **Image** | \`${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.tag }}\` |
          | **Panel URL** | http://YOUR_HOST:8787/ui/ |

          ### Pull & run (VPS)

          \`\`\`bash
          docker pull ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.tag }}
          docker run -d --name crossborder \\
            -p 8787:8787 \\
            -v crossborder-data:/app/data \\
            -v crossborder-config:/app/config \\
            --env-file .env \\
            --restart unless-stopped \\
            ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.tag }}
          \`\`\`

          ### Compose (from repo on server)

          \`\`\`bash
          export CROSSBORDER_IMAGE=${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.tag }}
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
          \`\`\`

          ### SSH deploy secrets (optional)

          | Secret | Purpose |
          |--------|---------|
          | \`DEPLOY_SSH_HOST\` | Server hostname |
          | \`DEPLOY_SSH_USER\` | SSH user |
          | \`DEPLOY_SSH_KEY\` | Private key |
          | \`DEPLOY_PATH\` | App directory (default \`/opt/crossborder-scraper\`) |
          EOF
