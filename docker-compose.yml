services:
  scraper-api:
    build: .
    ports:
      - "${PANEL_PORT:-8787}:8787"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      # You can also mount a real .env file into /app/.env
      - PANEL_HOST=0.0.0.0
      - PANEL_PORT=8787
      - HEADLESS=true
      - MAX_CONCURRENT_JOBS=3
      - PROXY_LIST_PATH=config/proxies.txt
      - AI_ENABLED=false
    restart: unless-stopped
