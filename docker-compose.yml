services:
  scraper-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      # You can also mount a real .env file into /app/.env
      - HEADLESS=true
      - MAX_CONCURRENT_JOBS=3
      - PROXY_LIST_PATH=config/proxies.txt
      - AI_ENABLED=false
    restart: unless-stopped

